import xyz.wagyourtail.unimined.api.minecraft.EnvType
import xyz.wagyourtail.unimined.api.minecraft.MinecraftJar
import xyz.wagyourtail.unimined.internal.minecraft.patch.fabric.OfficialFabricMinecraftTransformer
import xyz.wagyourtail.unimined.internal.minecraft.transform.merge.ClassMerger
import xyz.wagyourtail.unimined.internal.minecraft.MinecraftProvider

// 26.3 moved rendering into com/mojang/renderpearl, which Unimined's include globs (net/minecraft, blaze3d, math,
// realmsclient) strip from the merged jar: keep it, and tag the jar so the stripped cached one is not reused.
// Same as buildSrc's CustomOfficialFabricMinecraftTransformer (final, so repeated here) plus the renderpearl glob.
class RenderpearlFabricTransformer extends OfficialFabricMinecraftTransformer {
    private final ClassMerger plainMerger = new ClassMerger()

    RenderpearlFabricTransformer(Project project, MinecraftProvider provider) {
        super(project, provider)
    }

    @Override
    ClassMerger getMerger() {
        return plainMerger
    }

    @Override
    protected List<String> getIncludeGlobs() {
        return super.getIncludeGlobs() + ["com/mojang/renderpearl/**"]
    }

    @Override
    MinecraftJar mergedJar(MinecraftJar clientjar, MinecraftJar serverjar) {
        return new MinecraftJar(clientjar, clientjar.parentPath, clientjar.name, EnvType.COMBINED, clientjar.version,
            ["${providerName}-merged".toString(), "custom-no-environment", "renderpearl"] + clientjar.patches + serverjar.patches,
            clientjar.mappingNamespace, clientjar.fallbackNamespace, clientjar.awOrAt, clientjar.extension)
    }
}

plugins {
    id 'rec-mc-conventions'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

unimined.minecraft {
    version "26.3"

    mappings {
        devFallbackNamespace "official"
    }

    customPatcher(new RenderpearlFabricTransformer(project, delegate as MinecraftProvider)) {
        it.loader libs.versions.fabric.loader.get()
    }

    runs.config("client") {
        javaVersion = JavaVersion.VERSION_25
    }

    defaultRemapJar = true
}
